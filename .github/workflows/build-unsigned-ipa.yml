                            .disabled(runtime.busy)
                            if let m = runtime.mapResult {
                                row("Mapped Image", String(format: "%.1f MB", Double(m.imageBytes)/1_048_576.0))
                                row("Headers", "\(m.headerBytes) bytes")
                                row("Sections Mapped", "\(m.sectionsMapped)")
                                row("Entry Offset", "0x\(String(m.entryOffset,radix:16).uppercased())")
                                Text("Entry bytes: \(m.entryPreview)")
                                    .font(.caption.monospaced())
                                    .foregroundColor(.secondary)
                                    .textSelection(.enabled)
                            }
                        }
                    }

                    card {
                        Button {
                            runtime.runFoundationDiagnostics()
                        } label: {
                            HStack {
                                if runtime.busy { ProgressView() }
                                else { Image(systemName: "bolt.fill") }
                                Text("Run V5 Core Diagnostics")
                                    .fontWeight(.bold)
                            }
                            .frame(maxWidth: .infinity)
                            .padding(.vertical, 10)
                        }
                        .buttonStyle(.borderedProminent)
                        .tint(green)
                        .disabled(runtime.busy)

                        ForEach(runtime.stages) { stage in
                            HStack(alignment: .top, spacing: 10) {
                                Image(systemName: stage.passed ? "checkmark.circle.fill" : "exclamationmark.triangle.fill")
                                    .foregroundColor(stage.passed ? green : .orange)
                                VStack(alignment: .leading, spacing: 2) {
                                    Text(stage.name).fontWeight(.semibold)
                                    Text(stage.detail).font(.caption).foregroundColor(.secondary)
                                }
                                Spacer()
                            }
                        }
                    }

                    card {
                        HStack {
                            Text("Foundation Status").font(.headline)
                            Spacer()
                            Text(runtime.foundationReady ? "CORE PASS" : "NOT TESTED / PARTIAL")
                                .font(.caption.monospaced().bold())
                                .foregroundColor(runtime.foundationReady ? green : .secondary)
                        }
                        Text("Current milestone: PE image mapping. Next: relocations, import thunk resolution, Win64 ABI bridge, then JIT translation blocks. No DRM bypass is included.")
                            .font(.caption)
                            .foregroundColor(.secondary)
                    }

                    if !runtime.logLines.isEmpty {
                        card {
                            Text("Runtime Log").font(.headline)
                            Text(runtime.logLines.suffix(24).joined(separator: "\n"))
                                .font(.caption2.monospaced())
                                .foregroundColor(.secondary)
                                .textSelection(.enabled)
                        }
                    }
                }
                .padding(16)
            }
            .navigationBarHidden(true)
          }
          .navigationViewStyle(StackNavigationViewStyle())
          }

          private func card<Content: View>(@ViewBuilder _ content: () -> Content) -> some View {
          VStack(alignment: .leading, spacing: 12) { content() }
            .padding(16)
            .frame(maxWidth: .infinity, alignment: .leading)
            .background(
                LinearGradient(colors: [Color.white.opacity(0.085), Color.white.opacity(0.035)], startPoint: .topLeading, endPoint: .bottomTrailing)
            )
            .clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))
            .overlay(RoundedRectangle(cornerRadius: 20).stroke(Color.white.opacity(0.05), lineWidth: 1))
          }

          private func row(_ key: String, _ value: String) -> some View {
          HStack(alignment: .top) {
            Text(key).foregroundColor(.secondary)
            Spacer(minLength: 12)
            Text(value).font(.system(.body, design: .monospaced)).multilineTextAlignment(.trailing)
          }
          }
          }
          V5EOF14
          rm -rf V5iOS/Assets.xcassets
          mkdir -p V5iOS/Assets.xcassets/AppIcon.appiconset V5iOS/Assets.xcassets/BrandLogo.imageset

          cat > /tmp/v5icon.swift <<'V5ICON'
          import AppKit

          func renderIcon(size: Int, path: String) throws {
          let image = NSImage(size: NSSize(width: size, height: size))
          image.lockFocus()
          let rect = NSRect(x: 0, y: 0, width: size, height: size)
          let gradient = NSGradient(colors: [
          NSColor(calibratedRed: 0.01, green: 0.10, blue: 0.075, alpha: 1),
          NSColor(calibratedRed: 0.01, green: 0.025, blue: 0.022, alpha: 1)
          ])!
          gradient.draw(in: rect, angle: -45)

          let inset = CGFloat(size) * 0.055
          let border = NSBezierPath(roundedRect: rect.insetBy(dx: inset, dy: inset), xRadius: CGFloat(size)*0.18, yRadius: CGFloat(size)*0.18)
          NSColor(calibratedRed: 0.88, green: 0.67, blue: 0.23, alpha: 0.85).setStroke()
          border.lineWidth = CGFloat(size) * 0.012
          border.stroke()

          let p = NSMutableParagraphStyle(); p.alignment = .center
          let title = "V5"
          let titleAttrs: [NSAttributedString.Key: Any] = [
          .font: NSFont.systemFont(ofSize: CGFloat(size) * 0.38, weight: .black),
          .foregroundColor: NSColor.white,
          .paragraphStyle: p
          ]
          title.draw(in: NSRect(x: 0, y: CGFloat(size)*0.37, width: CGFloat(size), height: CGFloat(size)*0.44), withAttributes: titleAttrs)

          let subAttrs: [NSAttributedString.Key: Any] = [
          .font: NSFont.systemFont(ofSize: CGFloat(size) * 0.12, weight: .bold),
          .foregroundColor: NSColor(calibratedRed: 0.93, green: 0.72, blue: 0.30, alpha: 1),
          .paragraphStyle: p
          ]
          "iOS".draw(in: NSRect(x: 0, y: CGFloat(size)*0.25, width: CGFloat(size), height: CGFloat(size)*0.18), withAttributes: subAttrs)

          image.unlockFocus()
          guard let tiff = image.tiffRepresentation, let rep = NSBitmapImageRep(data: tiff), let png = rep.representation(using: .png, properties: [:]) else { throw NSError(domain:"V5",code:1) }
          try png.write(to: URL(fileURLWithPath: path))
          }
          try renderIcon(size: 1024, path: "V5iOS/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png")
          try renderIcon(size: 512, path: "V5iOS/Assets.xcassets/BrandLogo.imageset/BrandLogo.png")
          V5ICON
          swift /tmp/v5icon.swift

          cat > V5iOS/Assets.xcassets/Contents.json <<'V5ASSETROOT'
          {"info":{"author":"xcode","version":1}}
          V5ASSETROOT
          cat > V5iOS/Assets.xcassets/AppIcon.appiconset/Contents.json <<'V5APPICONJSON'
          {
          "images" : [
          { "idiom" : "universal", "platform" : "ios", "size" : "1024x1024", "filename" : "AppIcon-1024.png" }
          ],
          "info" : { "author" : "xcode", "version" : 1 }
          }
          V5APPICONJSON
          cat > V5iOS/Assets.xcassets/BrandLogo.imageset/Contents.json <<'V5BRANDJSON'
          {
          "images" : [
          { "idiom" : "universal", "scale" : "1x", "filename" : "BrandLogo.png" },
          { "idiom" : "universal", "scale" : "2x" },
          { "idiom" : "universal", "scale" : "3x" }
          ],
          "info" : { "author" : "xcode", "version" : 1 }
          }
          V5BRANDJSON

      - name: Download MoltenVK 1.4.2
        run: |
          cd V5iOS-v2.0-RUNTIME-CORE
          mkdir -p deps/mvk
          curl -fL --retry 3 \
            -o deps/MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar -xf deps/MoltenVK-ios.tar -C deps/mvk

          MVK_LIB=$(find "$PWD/deps/mvk" -type f -path '*/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a' -print -quit)
          VULKAN_H=$(find "$PWD/deps/mvk" -type f -path '*/vulkan/vulkan.h' -print -quit)
          test -f "$MVK_LIB"
          test -f "$VULKAN_H"
          MVK_INCLUDE=$(dirname "$(dirname "$VULKAN_H")")
          echo "MVK_LIB=$MVK_LIB" >> "$GITHUB_ENV"
          echo "MVK_INCLUDE=$MVK_INCLUDE" >> "$GITHUB_ENV"

      - name: Build V5iOS v2.0 Runtime Core
        run: |
          cd V5iOS-v2.0-RUNTIME-CORE
          xcodebuild \
            -project V5iOS.xcodeproj \
            -scheme V5iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            HEADER_SEARCH_PATHS="$MVK_INCLUDE" \
            OTHER_LDFLAGS="\$(inherited) $MVK_LIB -ObjC -lc++ -framework Metal -framework Foundation -framework Security -framework QuartzCore -framework CoreGraphics -framework UIKit -framework IOSurface -framework GameController" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          cd V5iOS-v2.0-RUNTIME-CORE
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload V5iOS-v2.0-RUNTIME-CORE-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry V5iOS-v2.0-RUNTIME-CORE-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-v2.0-RUNTIME-CORE-unsigned-ipa
          path: V5iOS-v2.0-RUNTIME-CORE/V5iOS-v2.0-RUNTIME-CORE-unsigned.ipa
          if-no-files-found: error
