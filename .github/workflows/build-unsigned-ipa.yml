          enum MetalPipelineProbe {
          static func run() -> MetalPipelineProbeResult {
          guard let device = MTLCreateSystemDefaultDevice() else {
            return .init(success: false, deviceName: "Unavailable", status: "No Metal device")
          }
          guard let queue = device.makeCommandQueue() else {
            return .init(success: false, deviceName: device.name, status: "Could not create Metal command queue")
          }

          let source = """
          #include <metal_stdlib>
          using namespace metal;
          struct VOut { float4 position [[position]]; float4 color; };
          vertex VOut v5_vertex(uint id [[vertex_id]]) {
            float2 p[3] = { float2(0.0, 0.75), float2(-0.75, -0.65), float2(0.75, -0.65) };
            float4 c[3] = { float4(0.1,1.0,0.55,1), float4(0.95,0.72,0.25,1), float4(0.2,0.55,1.0,1) };
            VOut o; o.position = float4(p[id], 0, 1); o.color = c[id]; return o;
          }
          fragment float4 v5_fragment(VOut in [[stage_in]]) { return in.color; }
          """

          do {
            let library = try device.makeLibrary(source: source, options: nil)
            guard let vertex = library.makeFunction(name: "v5_vertex"),
                  let fragment = library.makeFunction(name: "v5_fragment") else {
                return .init(success: false, deviceName: device.name, status: "Metal shader entry points missing")
            }

            let pipelineDesc = MTLRenderPipelineDescriptor()
            pipelineDesc.vertexFunction = vertex
            pipelineDesc.fragmentFunction = fragment
            pipelineDesc.colorAttachments[0].pixelFormat = .bgra8Unorm
            let pipeline = try device.makeRenderPipelineState(descriptor: pipelineDesc)

            let textureDesc = MTLTextureDescriptor.texture2DDescriptor(pixelFormat: .bgra8Unorm, width: 64, height: 64, mipmapped: false)
            textureDesc.usage = [.renderTarget, .shaderRead]
            textureDesc.storageMode = .shared
            guard let texture = device.makeTexture(descriptor: textureDesc),
                  let commandBuffer = queue.makeCommandBuffer() else {
                return .init(success: false, deviceName: device.name, status: "Could not allocate Metal render resources")
            }

            let pass = MTLRenderPassDescriptor()
            pass.colorAttachments[0].texture = texture
            pass.colorAttachments[0].loadAction = .clear
            pass.colorAttachments[0].storeAction = .store
            pass.colorAttachments[0].clearColor = MTLClearColor(red: 0.01, green: 0.03, blue: 0.025, alpha: 1.0)
            guard let encoder = commandBuffer.makeRenderCommandEncoder(descriptor: pass) else {
                return .init(success: false, deviceName: device.name, status: "Could not create render encoder")
            }
            encoder.setRenderPipelineState(pipeline)
            encoder.drawPrimitives(type: .triangle, vertexStart: 0, vertexCount: 3)
            encoder.endEncoding()
            commandBuffer.commit()
            commandBuffer.waitUntilCompleted()

            let ok = commandBuffer.status == .completed
            return .init(
                success: ok,
                deviceName: device.name,
                status: ok ? "V5 Metal PASS: shader compiled, pipeline created, offscreen triangle submitted" : "Metal command buffer failed: \(commandBuffer.error?.localizedDescription ?? "unknown")"
            )
          } catch {
            return .init(success: false, deviceName: device.name, status: "Metal pipeline error: \(error.localizedDescription)")
          }
          }
