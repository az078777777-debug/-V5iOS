name: Sync V5iOS Hybrid Runtime 5.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout V5iOS repository
        uses: actions/checkout@v4

      - name: Find latest successful Madeira runtime artifact
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/Makaria122/Madeira-IPA"

          RUN_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1")"

          RUN_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workflow_runs"][0]["id"])' <<<"$RUN_JSON")"
          test -n "$RUN_ID"

          ART_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/runs/$RUN_ID/artifacts")"

          ARTIFACT_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d["artifacts"] if x["name"]=="Madeira-unsigned" and not x["expired"]]; print(a[0]["id"])' <<<"$ART_JSON")"
          test -n "$ARTIFACT_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "Using upstream run $RUN_ID artifact $ARTIFACT_ID"

      - name: Download latest successful runtime
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upstream.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p upstream

          # First try GitHub's artifact API directly.
          if gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/Makaria122/Madeira-IPA/actions/artifacts/$ARTIFACT_ID/zip" \
            > /tmp/madeira-artifact.zip; then
            echo "Downloaded from GitHub Actions API"
          else
            echo "Direct artifact API was unavailable; trying public nightly mirror."
            curl -fL --retry 3 \
              "https://nightly.link/Makaria122/Madeira-IPA/workflows/build.yml/main/Madeira-unsigned.zip" \
              -o /tmp/madeira-artifact.zip
          fi

          unzip -q /tmp/madeira-artifact.zip -d upstream
          test -s upstream/Madeira.ipa

          if [ -s upstream/Madeira.ipa.sha256 ]; then
            EXPECTED="$(awk '{print $1}' upstream/Madeira.ipa.sha256)"
            ACTUAL="$(shasum -a 256 upstream/Madeira.ipa | awk '{print $1}')"
            echo "Upstream IPA SHA-256: $ACTUAL"
            test "$EXPECTED" = "$ACTUAL"
          fi

      - name: Brand runtime as V5iOS Hybrid Runtime 5.0
        run: |
          set -euo pipefail
          rm -rf repack Payload
          mkdir repack

          unzip -q upstream/Madeira.ipa -d repack
          APP="$(find repack/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName V5iOS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName V5iOS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.v5ios.runtime" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 5.0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 500" "$APP/Info.plist"

          # Editing the plist invalidates the upstream ad-hoc signature.
          # ESign will apply the user's own signature after download.
          rm -rf "$APP/_CodeSignature"

          cat > "$APP/V5IOS-SOURCE-NOTICE.txt" <<'EOF'
          V5iOS Hybrid Runtime 5.0
          Branding: AELLE STORE / Ali Tahseen
          Runtime base: Madeira (Wine + FEX-Emu + DXMT)
          Source: https://github.com/Makaria122/Madeira-IPA
          Upstream: https://github.com/willfaust/Madeira
          License: GPL-3.0-or-later plus bundled third-party licenses/notices.
          No GTA V or other game files are included.
          EOF

          rm -f V5iOS-HYBRID-RUNTIME-5.0.ipa
          (
            cd repack
            /usr/bin/zip -qry ../V5iOS-HYBRID-RUNTIME-5.0.ipa Payload
          )

          test -s V5iOS-HYBRID-RUNTIME-5.0.ipa
          shasum -a 256 V5iOS-HYBRID-RUNTIME-5.0.ipa | tee V5iOS-HYBRID-RUNTIME-5.0.ipa.sha256
          ls -lh V5iOS-HYBRID-RUNTIME-5.0.ipa

      - name: Upload V5iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-HYBRID-RUNTIME-5.0
          path: |
            V5iOS-HYBRID-RUNTIME-5.0.ipa
            V5iOS-HYBRID-RUNTIME-5.0.ipa.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "# V5iOS Hybrid Runtime 5.0"
            echo
            echo "Runtime: Madeira / Wine + FEX + DXMT"
            echo "Upstream successful run: ${{ steps.upstream.outputs.run_id }}"
            echo
            if [ -f V5iOS-HYBRID-RUNTIME-5.0.ipa ]; then
              echo "IPA: generated"
              echo "SHA-256: \`$(shasum -a 256 V5iOS-HYBRID-RUNTIME-5.0.ipa | awk '{print $1}')\`"
              echo "Size: $(du -h V5iOS-HYBRID-RUNTIME-5.0.ipa | awk '{print $1}')"
            else
              echo "IPA: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
