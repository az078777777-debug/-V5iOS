name: Build V5iOS v2.0 Runtime Core IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-unsigned-ipa.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch V5iOS baseline
        run: |
          rm -rf V5iOS-v0.2 V5iOS-v2.0-RUNTIME-CORE
          curl -fL --retry 3 \
            -o /tmp/V5iOS-base.zip \
            https://raw.githubusercontent.com/az078777777-debug/-V5iOS/01d73326de272da2999d255fd9cf7eb6043ce304/V5iOS-v0.2-AELLE-STORE.zip
          unzip -q /tmp/V5iOS-base.zip
          test -d V5iOS-v0.2
          mv V5iOS-v0.2 V5iOS-v2.0-RUNTIME-CORE

      - name: Install V5 Runtime Core sources
        run: |
          cd V5iOS-v2.0-RUNTIME-CORE
          mkdir -p "$(dirname 'V5iOS.xcodeproj/project.pbxproj')"
          cat > 'V5iOS.xcodeproj/project.pbxproj' <<'V5EOF00'
