          import Foundation
          import Darwin

          struct RuntimeMemoryProbeResult {
          let success: Bool
          let bytes: Int
          let status: String
          }

          enum RuntimeMemoryProbe {
          static func run() -> RuntimeMemoryProbeResult {
          let page = max(Int(getpagesize()), 4096)
          let size = page * 4
          let ptr = mmap(nil, size, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANON, -1, 0)
          guard ptr != MAP_FAILED else {
            return .init(success: false, bytes: 0, status: "mmap RW allocation failed")
          }
          defer { munmap(ptr, size) }

          let bytes = ptr!.assumingMemoryBound(to: UInt8.self)
          for i in 0..<min(size, 256) { bytes[i] = UInt8(i & 0xFF) }
          let ok = bytes[42] == 42
          return .init(success: ok, bytes: size, status: ok ? "V5 memory PASS: RW guest arena allocated and verified" : "Guest memory verification failed")
          }
          }
