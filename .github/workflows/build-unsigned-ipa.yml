          func u32(at offset: Int) throws -> UInt32 {
          guard offset >= 0, offset + 4 <= count else { throw PEParseError.malformed("Read outside file bounds.") }
          return UInt32(byte(at: offset)) |
            (UInt32(byte(at: offset + 1)) << 8) |
            (UInt32(byte(at: offset + 2)) << 16) |
            (UInt32(byte(at: offset + 3)) << 24)
          }

          func u64(at offset: Int) throws -> UInt64 {
          guard offset >= 0, offset + 8 <= count else { throw PEParseError.malformed("Read outside file bounds.") }
          var value: UInt64 = 0
          for i in 0..<8 { value |= UInt64(byte(at: offset + i)) << UInt64(i * 8) }
