          guard entry >= 0, entry < image.count else { throw PEMapError.malformed("Entry RVA outside mapped image.") }
          let n = min(16, image.count-entry)
          let preview = image[entry..<(entry+n)].map { String(format:"%02X",$0) }.joined(separator:" ")
          return .init(success:true,imageBytes:image.count,headerBytes:headerBytes,sectionsMapped:mapped,entryOffset:entry,entryPreview:preview)
