name: Sync V5iOS Hybrid Runtime 5.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-unsigned-ipa.yml"

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout V5iOS repository
        uses: actions/checkout@v4

      - name: Download latest successful Madeira runtime
        run: |
          set -euo pipefail
          rm -rf upstream
          mkdir -p upstream

          curl -fL --retry 5 --retry-delay 3 \
            "https://nightly.link/Makaria122/Madeira-IPA/workflows/build/main/Madeira-unsigned.zip" \
            -o /tmp/madeira-artifact.zip

          unzip -q /tmp/madeira-artifact.zip -d upstream
          test -s upstream/Madeira.ipa

          if [ -s upstream/Madeira.ipa.sha256 ]; then
            EXPECTED="$(awk '{print $1}' upstream/Madeira.ipa.sha256)"
            ACTUAL="$(shasum -a 256 upstream/Madeira.ipa | awk '{print $1}')"
            echo "Upstream IPA SHA-256: $ACTUAL"
            test "$EXPECTED" = "$ACTUAL"
          fi

      - name: Brand runtime as V5iOS Hybrid Runtime 5.0
        run: |
          set -euo pipefail
          rm -rf repack
          mkdir -p repack

          unzip -q upstream/Madeira.ipa -d repack
          APP="$(find repack/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName V5iOS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName V5iOS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.v5ios.runtime" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 5.0" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 500" "$APP/Info.plist"

          rm -rf "$APP/_CodeSignature"

          cat > "$APP/V5IOS-SOURCE-NOTICE.txt" <<'EOF'
          V5iOS Hybrid Runtime 5.0
          Branding: AELLE STORE / Ali Tahseen
          Runtime base: Madeira (Wine + FEX-Emu + DXMT)
          Source: https://github.com/Makaria122/Madeira-IPA
          Upstream: https://github.com/willfaust/Madeira
          License: GPL-3.0-or-later plus bundled third-party licenses/notices.
          No GTA V or other game files are included.
          EOF

          rm -f V5iOS-HYBRID-RUNTIME-5.0.ipa
          (
            cd repack
            /usr/bin/zip -qry ../V5iOS-HYBRID-RUNTIME-5.0.ipa Payload
          )

          test -s V5iOS-HYBRID-RUNTIME-5.0.ipa
          shasum -a 256 V5iOS-HYBRID-RUNTIME-5.0.ipa | tee V5iOS-HYBRID-RUNTIME-5.0.ipa.sha256
          ls -lh V5iOS-HYBRID-RUNTIME-5.0.ipa

      - name: Upload V5iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-HYBRID-RUNTIME-5.0
          path: |
            V5iOS-HYBRID-RUNTIME-5.0.ipa
            V5iOS-HYBRID-RUNTIME-5.0.ipa.sha256
          retention-days: 30
          if-no-files-found: error
