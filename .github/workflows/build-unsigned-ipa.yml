name: Build V5iOS v0.2 AELLE STORE IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V5iOS
        run: |
          rm -rf V5iOS-v0.2
          unzip -q V5iOS-v0.2-AELLE-STORE.zip
          test -d V5iOS-v0.2

      - name: Download MoltenVK 1.4.2
        run: |
          cd V5iOS-v0.2
          mkdir -p deps/mvk

          curl -fL --retry 3 \
            -o deps/MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar

          tar -xf deps/MoltenVK-ios.tar -C deps/mvk

          MVK_LIB=$(find "$PWD/deps/mvk" \
            -type f \
            -path '*/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a' \
            -print -quit)

          VULKAN_H=$(find "$PWD/deps/mvk" \
            -type f \
            -path '*/vulkan/vulkan.h' \
            -print -quit)

          test -f "$MVK_LIB"
          test -f "$VULKAN_H"

          MVK_INCLUDE=$(dirname "$(dirname "$VULKAN_H")")

          echo "MVK_LIB=$MVK_LIB" >> "$GITHUB_ENV"
          echo "MVK_INCLUDE=$MVK_INCLUDE" >> "$GITHUB_ENV"

          echo "MoltenVK library: $MVK_LIB"
          echo "Vulkan headers: $MVK_INCLUDE"

      - name: Build iPhone app
        run: |
          cd V5iOS-v0.2

          xcodebuild \
            -project V5iOS.xcodeproj \
            -scheme V5iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            HEADER_SEARCH_PATHS="$MVK_INCLUDE" \
            OTHER_LDFLAGS="\$(inherited) $MVK_LIB -ObjC -lc++ -framework Metal -framework Foundation -framework QuartzCore -framework CoreGraphics -framework UIKit -framework IOSurface" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          cd V5iOS-v0.2

          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print \
            -quit)

          test -n "$APP"

          rm -rf Payload V5iOS-v0.2-AELLE-STORE-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry V5iOS-v0.2-AELLE-STORE-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-v0.2-AELLE-STORE-unsigned-ipa
          path: V5iOS-v0.2/V5iOS-v0.2-AELLE-STORE-unsigned.ipa
          if-no-files-found: error
