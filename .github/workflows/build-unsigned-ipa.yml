          V5UI

          # Update bundle metadata to v1.0.
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 1.0' V5iOS-v0.2/V5iOS/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 100' V5iOS-v0.2/V5iOS/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleGetInfoString V5iOS v1.0 — Built by AELLE STORE • © 2026 Ali Tahseen' V5iOS-v0.2/V5iOS/Info.plist

          # Add an asset catalog to the existing Xcode project.
          python3 <<'PYPROJECT'
          from pathlib import Path
          p = Path('V5iOS-v0.2/V5iOS.xcodeproj/project.pbxproj')
          s = p.read_text()
          if 'Assets.xcassets in Resources' not in s:
              s=s.replace('A00000000000000000000007 /* VulkanProbe.c in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000009 /* VulkanProbe.c */; };',
                          'A00000000000000000000007 /* VulkanProbe.c in Sources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000009 /* VulkanProbe.c */; };\n\t\tA00000000000000000000008 /* Assets.xcassets in Resources */ = {isa = PBXBuildFile; fileRef = B00000000000000000000011 /* Assets.xcassets */; };')
              s=s.replace('B00000000000000000000010 /* VulkanProbeBridge.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = VulkanProbeBridge.h; sourceTree = "<group>"; };',
                          'B00000000000000000000010 /* VulkanProbeBridge.h */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.h; path = VulkanProbeBridge.h; sourceTree = "<group>"; };\n\t\tB00000000000000000000011 /* Assets.xcassets */ = {isa = PBXFileReference; lastKnownFileType = folder.assetcatalog; path = Assets.xcassets; sourceTree = "<group>"; };')
