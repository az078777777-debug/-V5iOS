          guard imageSize > 0, imageSize <= 512 * 1024 * 1024 else { throw PEMapError.invalidImageSize }
          var image = Data(count: imageSize)
          guard file.count >= 0x40 else { throw PEMapError.malformed("PE file is truncated.") }

          let pe = Int(try u32(file, 0x3C))
          guard pe + 24 <= file.count else { throw PEMapError.malformed("PE header outside file.") }
          let optionalSize = Int(try u16(file, pe + 4 + 16))
          let optional = pe + 4 + 20
          guard optional + optionalSize <= file.count else { throw PEMapError.malformed("Optional header truncated.") }

          let sizeOfHeaders = Int(try u32(file, optional + 60))
          let headerBytes = min(sizeOfHeaders, min(file.count, image.count))
          if headerBytes > 0 { image.replaceSubrange(0..<headerBytes, with: file[0..<headerBytes]) }

