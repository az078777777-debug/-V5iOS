          var imports: [String] = []
          if optionalHeaderSize >= 128 {
            let importRVA = try data.u32(at: optional + 120)
            let importSize = try data.u32(at: optional + 124)
            if importRVA != 0, importSize != 0, let importOffset = fileOffset(forRVA: importRVA, sections: sections) {
