          import Foundation

          struct V5CPUProbeResult {
          let success: Bool
          let rax: UInt64
          let instructionCount: UInt32
          let status: String
          }

          enum V5CPUProbe {
          static func run() -> V5CPUProbeResult {
          let result = V5RunCPUProbe()
          let status = withUnsafePointer(to: result.status) { ptr in
            ptr.withMemoryRebound(to: CChar.self, capacity: 256) {
                String(cString: $0)
            }
          }
          return V5CPUProbeResult(
            success: result.success != 0,
            rax: result.rax,
            instructionCount: result.instructionCount,
            status: status
          )
          }
