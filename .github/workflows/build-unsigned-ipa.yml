name: Build V5iOS v0.2 AELLE STORE IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V5iOS v0.2 AELLE STORE
        run: |
          rm -rf V5iOS-v0.2
          unzip -q V5iOS-v0.2-AELLE-STORE.zip
          test -d V5iOS-v0.2

      - name: Download official MoltenVK 1.4.2 for iOS
        run: |
          cd V5iOS-v0.2
          mkdir -p deps
          curl -fL --retry 3 \
            -o deps/MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          mkdir -p deps/mvk
          tar -xf deps/MoltenVK-ios.tar -C deps/mvk

          MVK_XCFW=$(find "$PWD/deps/mvk" -type d -path '*/static/MoltenVK.xcframework' -print -quit)
          MVK_SLICE=$(find "$MVK_XCFW" -maxdepth 2 -type d -name 'ios-arm64' -print -quit)
          MVK_INCLUDE=$(find "$PWD/deps/mvk" -type d -path '*/MoltenVK/include' -print -quit)

          test -n "$MVK_XCFW"
          test -n "$MVK_SLICE"
          test -n "$MVK_INCLUDE"
          test -d "$MVK_SLICE/MoltenVK.framework"

          echo "MVK_SLICE=$MVK_SLICE" >> "$GITHUB_ENV"
          echo "MVK_INCLUDE=$MVK_INCLUDE" >> "$GITHUB_ENV"

      - name: Build iPhone app with MoltenVK
        run: |
          cd V5iOS-v0.2

          xcodebuild \
            -project V5iOS.xcodeproj \
            -scheme V5iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            HEADER_SEARCH_PATHS="$MVK_INCLUDE" \
            FRAMEWORK_SEARCH_PATHS="$MVK_SLICE" \
            OTHER_LDFLAGS='$(inherited) -framework MoltenVK -lc++ -framework Metal -framework Foundation -framework QuartzCore -framework CoreGraphics -framework UIKit -framework IOSurface' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          cd V5iOS-v0.2
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -name '*.app' \
            -print \
            -quit)

          test -n "$APP"
          rm -rf Payload V5iOS-v0.2-AELLE-STORE-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry V5iOS-v0.2-AELLE-STORE-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-v0.2-AELLE-STORE-unsigned-ipa
          path: V5iOS-v0.2/V5iOS-v0.2-AELLE-STORE-unsigned.ipa
          if-no-files-found: error
