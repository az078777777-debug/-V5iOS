          cat > 'V5iOS/Runtime/CPU/V5CPUCore.cpp' <<'V5EOF06'
          #include "V5CPUBridge.h"
          #include <cstring>
          #include <cstddef>

          namespace {
          struct CPUState {
          uint64_t rax = 0;
          bool halted = false;
          };

          static uint32_t readU32(const uint8_t* p) {
          return (uint32_t)p[0] |
           ((uint32_t)p[1] << 8) |
           ((uint32_t)p[2] << 16) |
           ((uint32_t)p[3] << 24);
          }

          static uint64_t readU64(const uint8_t* p) {
          uint64_t value = 0;
          for (int i = 0; i < 8; ++i) value |= ((uint64_t)p[i] << (i * 8));
          return value;
          }

          class TinyX64Executor {
          public:
          bool run(const uint8_t* code, size_t size, CPUState& cpu, uint32_t& count, const char*& error) {
          size_t ip = 0;
          count = 0;
          while (ip < size && !cpu.halted && count < 128) {
            ++count;

            // NOP
            if (code[ip] == 0x90) { ++ip; continue; }

            // RET
            if (code[ip] == 0xC3) { cpu.halted = true; ++ip; continue; }

            // MOV RAX, imm64   48 B8 imm64
            if (ip + 10 <= size && code[ip] == 0x48 && code[ip + 1] == 0xB8) {
                cpu.rax = readU64(code + ip + 2);
                ip += 10;
                continue;
            }

            // ADD RAX, imm32   48 05 imm32 (sign extended)
            if (ip + 6 <= size && code[ip] == 0x48 && code[ip + 1] == 0x05) {
                int32_t imm = (int32_t)readU32(code + ip + 2);
                cpu.rax = (uint64_t)((int64_t)cpu.rax + (int64_t)imm);
                ip += 6;
                continue;
            }

            // SUB RAX, imm32   48 2D imm32 (sign extended)
            if (ip + 6 <= size && code[ip] == 0x48 && code[ip + 1] == 0x2D) {
                int32_t imm = (int32_t)readU32(code + ip + 2);
                cpu.rax = (uint64_t)((int64_t)cpu.rax - (int64_t)imm);
                ip += 6;
                continue;
            }

            error = "unsupported x86-64 opcode in V5CPU foundation";
            return false;
          }

          if (!cpu.halted) {
            error = "program did not halt";
            return false;
          }
          return true;
          }
          };
          }

          V5CPUProbeResultC V5RunCPUProbe(void) {
          V5CPUProbeResultC out{};

          // Synthetic x86-64: mov rax,42 ; add rax,10 ; sub rax,2 ; ret
          const uint8_t program[] = {
          0x48, 0xB8, 0x2A,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
          0x48, 0x05, 0x0A,0x00,0x00,0x00,
          0x48, 0x2D, 0x02,0x00,0x00,0x00,
          0xC3
          };

          CPUState cpu;
          uint32_t count = 0;
          const char* error = nullptr;
          TinyX64Executor engine;
          const bool ok = engine.run(program, sizeof(program), cpu, count, error);

          out.success = (ok && cpu.rax == 50) ? 1 : 0;
          out.rax = cpu.rax;
          out.instructionCount = count;
          const char* status = out.success
          ? "V5CPU PASS: internal x86-64 decoder/executor produced RAX=50"
          : (error ? error : "V5CPU probe failed");
          std::strncpy(out.status, status, sizeof(out.status) - 1);
          out.status[sizeof(out.status) - 1] = '\0';
          return out;
          }
