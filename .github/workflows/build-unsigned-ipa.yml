          import SwiftUI
          import GameController

          struct ContentView: View {
          enum Tab: Hashable {
          case home, runtime, graphics, system, controller, files
          }

          @State private var selection: Tab = .home
          @StateObject private var runtime = V5RuntimeCoordinator()
          @State private var showRuntimeAlert = false
          @State private var showFolderPicker = false
          @State private var scanResult: GameScanResult?
          @State private var vulkanResult: VulkanProbeResult?
          @State private var vulkanRunning = false
          @State private var controllerName = "No controller connected"

          @AppStorage("resolutionScale") private var resolutionScale = 1.0
          @AppStorage("vsync") private var vsync = true
          @AppStorage("frameLimit") private var frameLimit = 60.0
          @AppStorage("anisotropic") private var anisotropic = 16.0
          @AppStorage("shadows") private var shadows = true
          @AppStorage("reflections") private var reflections = true
          @AppStorage("motionBlur") private var motionBlur = false
          @AppStorage("controllerEnabled") private var controllerEnabled = true
          @AppStorage("controllerVibration") private var controllerVibration = true
          @AppStorage("buttonPrompts") private var buttonPrompts = true
          @AppStorage("lookSensitivity") private var lookSensitivity = 1.0
          @AppStorage("aimSensitivity") private var aimSensitivity = 1.0

          private let report = DeviceProbe.current()
          private let green = Color(red: 0.04, green: 0.72, blue: 0.43)
          private let darkGreen = Color(red: 0.015, green: 0.09, blue: 0.075)
          private let gold = Color(red: 0.92, green: 0.72, blue: 0.34)

          var body: some View {
          ZStack {
            LinearGradient(
                gradient: Gradient(colors: [darkGreen, Color.black]),
                startPoint: .topLeading,
                endPoint: .bottomTrailing
            )
            .ignoresSafeArea()

            TabView(selection: $selection) {
                homeView
                    .tag(Tab.home)
                    .tabItem { Label("Home", systemImage: "house.fill") }

                RuntimeDashboardView(runtime: runtime, showFolderPicker: $showFolderPicker)
                    .tag(Tab.runtime)
                    .tabItem { Label("Runtime", systemImage: "cpu.fill") }

                graphicsView
                    .tag(Tab.graphics)
                    .tabItem { Label("Graphics", systemImage: "gearshape.2.fill") }

                systemView
                    .tag(Tab.system)
                    .tabItem { Label("Vulkan", systemImage: "bolt.horizontal.fill") }

                controllerView
                    .tag(Tab.controller)
                    .tabItem { Label("Controller", systemImage: "gamecontroller.fill") }

                filesView
                    .tag(Tab.files)
                    .tabItem { Label("Files", systemImage: "folder.fill") }
            }
            .accentColor(green)
          }
          .preferredColorScheme(.dark)
          .sheet(isPresented: $showFolderPicker) {
            FolderPicker { url in
                if url.pathExtension.lowercased() == "exe" {
                    scanResult = nil
                    runtime.selectExecutable(url)
                } else {
                    scanResult = GameFolderScanner.scan(url: url)
                    runtime.select(folder: url)
                }
                showFolderPicker = false
            }
          }
          .onAppear {
            refreshController()
          }
          }

          private var homeView: some View {
          NavigationView {
            ScrollView {
                VStack(spacing: 18) {
                    heroCard
                    quickStatus
                    menuCard
                    socialCard
                    copyrightFooter
                }
                .padding(16)
            }
            .navigationBarHidden(true)
          }
          .navigationViewStyle(StackNavigationViewStyle())
          }

          private var heroCard: some View {
          VStack(spacing: 14) {
            HStack(spacing: 14) {
                Image("BrandLogo")
                    .resizable()
                    .scaledToFit()
                    .frame(width: 86, height: 86)
                    .clipShape(RoundedRectangle(cornerRadius: 22, style: .continuous))
                    .overlay(RoundedRectangle(cornerRadius: 22).stroke(gold.opacity(0.55), lineWidth: 1))
                    .shadow(color: green.opacity(0.25), radius: 16)

                VStack(alignment: .leading, spacing: 3) {
                    HStack(spacing: 6) {
                        Text("V5")
                            .font(.system(size: 42, weight: .black, design: .rounded))
                        Text("iOS")
                            .font(.system(size: 40, weight: .black, design: .rounded))
                            .foregroundColor(gold)
                    }
                    Text("Runtime Core")
                        .font(.headline)
                    Text("Release 2.1 • V5 Runtime Foundation")
                        .font(.caption.monospaced())
                        .foregroundColor(.secondary)
                }
                Spacer()
            }

            HStack(spacing: 8) {
                badge("Vulkan PASS", icon: "checkmark.seal.fill")
                badge("A15 Ready", icon: "cpu.fill")
                badge("iOS", icon: "iphone")
            }

            Button {
                selection = .runtime
            } label: {
                HStack {
                    Image(systemName: "play.fill")
                    Text("Open V5 Runtime Core")
                        .fontWeight(.bold)
                    Spacer()
                    Image(systemName: "chevron.right")
                }
                .padding(.horizontal, 18)
                .padding(.vertical, 14)
                .frame(maxWidth: .infinity)
                .background(green)
                .foregroundColor(.white)
                .clipShape(RoundedRectangle(cornerRadius: 14, style: .continuous))
            }
          }
          .padding(18)
          .background(cardBackground)
          .clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
          .overlay(RoundedRectangle(cornerRadius: 24).stroke(gold.opacity(0.18), lineWidth: 1))
          }

          private var quickStatus: some View {
          HStack(spacing: 10) {
            statusTile("Metal", report.metalAvailable ? "Ready" : "Unavailable", "cpu")
            statusTile("GPU", "A15", "memorychip")
            statusTile("RAM", String(format: "%.1f GB", report.physicalMemoryGB), "rectangle.3.group")
          }
          }

