          guard offset >= 0, offset < count else { return "" }
          var bytes: [UInt8] = []
          for i in 0..<maxLength where offset + i < count {
            let b = byte(at: offset + i)
            if b == 0 { break }
            bytes.append(b)
          }
          return String(bytes: bytes, encoding: .ascii) ?? ""
          }

          func cString(at offset: Int, maxLength: Int) -> String {
          asciiString(at: offset, maxLength: maxLength)
          }
