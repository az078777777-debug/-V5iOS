              s=s.replace('files = ();\n\t\t\trunOnlyForDeploymentPostprocessing = 0;', 'files = (\n\t\t\t\tA00000000000000000000008 /* Assets.xcassets in Resources */,\n\t\t\t);\n\t\t\trunOnlyForDeploymentPostprocessing = 0;', 1)
          s=s.replace('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = 100;')
          s=s.replace('MARKETING_VERSION = 0.2;', 'MARKETING_VERSION = 1.0;')
