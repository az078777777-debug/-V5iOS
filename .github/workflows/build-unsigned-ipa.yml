          return PEImageInfo(
            path: url.path,
            machine: machine,
            numberOfSections: sectionCount,
            entryPointRVA: entry,
            imageBase: imageBase,
            imageSize: imageSize,
            subsystem: subsystem,
            sections: sections,
            importedDLLs: Array(Set(imports)).sorted()
