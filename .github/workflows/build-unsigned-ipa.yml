                    let forwarder = try data.u32(at: cursor + 8)
                    let nameRVA = try data.u32(at: cursor + 12)
                    let firstThunk = try data.u32(at: cursor + 16)
                    if originalThunk == 0, timeDate == 0, forwarder == 0, nameRVA == 0, firstThunk == 0 { break }
