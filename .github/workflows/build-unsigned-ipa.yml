                virtualAddress: try data.u32(at: off + 12),
                virtualSize: try data.u32(at: off + 8),
                rawOffset: try data.u32(at: off + 20),
                rawSize: try data.u32(at: off + 16),
                characteristics: try data.u32(at: off + 36)
