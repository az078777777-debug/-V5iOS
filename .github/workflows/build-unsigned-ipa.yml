          enum RuntimeBookmarkStore {
          private static let key = "V5Runtime.GameFolderBookmark"

          static func save(url: URL) throws {
          // .withSecurityScope is macOS-only. On iOS, persist the document-picker URL
          // using a normal bookmark and reacquire access when the URL is used.
          let data = try url.bookmarkData(options: [], includingResourceValuesForKeys: nil, relativeTo: nil)
