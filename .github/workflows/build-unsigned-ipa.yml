          import Foundation

          struct PESection: Identifiable, Hashable {
          let id = UUID()
          let name: String
          let virtualAddress: UInt32
          let virtualSize: UInt32
          let rawOffset: UInt32
          let rawSize: UInt32
          let characteristics: UInt32
          }

          struct PEImageInfo {
          let path: String
          let machine: UInt16
          let numberOfSections: UInt16
          let entryPointRVA: UInt32
          let imageBase: UInt64
          let imageSize: UInt32
          let subsystem: UInt16
          let sections: [PESection]
          let importedDLLs: [String]

          var isAMD64: Bool { machine == 0x8664 }
          var machineName: String { isAMD64 ? "x86-64 (AMD64)" : String(format: "0x%04X", machine) }
          }

          enum PEParseError: Error, LocalizedError {
          case tooSmall
          case missingMZ
          case invalidPEOffset
          case missingPESignature
          case unsupportedOptionalHeader(UInt16)
          case malformed(String)

          var errorDescription: String? {
          switch self {
          case .tooSmall: return "File is too small to be a PE image."
          case .missingMZ: return "Missing DOS MZ signature."
          case .invalidPEOffset: return "Invalid PE header offset."
          case .missingPESignature: return "Missing PE signature."
