          p.write_text(s)
          PYPROJECT

          # Build a custom V5iOS/AELLE STORE icon locally on the macOS runner.
          mkdir -p V5iOS-v0.2/V5iOS/Assets.xcassets/AppIcon.appiconset
          mkdir -p V5iOS-v0.2/V5iOS/Assets.xcassets/BrandLogo.imageset
          cat > /tmp/make_icon.swift <<'SWIFTICON'
          import AppKit
          let size = NSSize(width: 1024, height: 1024)
          let img = NSImage(size: size)
          img.lockFocus()
          let rect = NSRect(origin: .zero, size: size)
          let path = NSBezierPath(roundedRect: rect.insetBy(dx: 18, dy: 18), xRadius: 220, yRadius: 220)
          let grad = NSGradient(colors: [NSColor(calibratedRed: 0.005, green: 0.06, blue: 0.05, alpha: 1), NSColor.black])!
          grad.draw(in: path, angle: -45)
          NSColor(calibratedRed: 0.93, green: 0.72, blue: 0.32, alpha: 1).setStroke()
          path.lineWidth = 18; path.stroke()
          let para = NSMutableParagraphStyle(); para.alignment = .center
          let gold = NSColor(calibratedRed: 0.96, green: 0.76, blue: 0.37, alpha: 1)
          let white = NSColor.white
          let a1:[NSAttributedString.Key:Any] = [.font:NSFont.systemFont(ofSize:310, weight:.black), .foregroundColor:white, .paragraphStyle:para]
          let a2:[NSAttributedString.Key:Any] = [.font:NSFont.systemFont(ofSize:145, weight:.heavy), .foregroundColor:gold, .paragraphStyle:para]
          NSString(string:"V5").draw(in:NSRect(x:70,y:390,width:884,height:360), withAttributes:a1)
          NSString(string:"iOS").draw(in:NSRect(x:70,y:255,width:884,height:190), withAttributes:a2)
          let a3:[NSAttributedString.Key:Any] = [.font:NSFont.systemFont(ofSize:54, weight:.semibold), .foregroundColor:NSColor(calibratedWhite:0.82,alpha:1), .paragraphStyle:para]
          NSString(string:"AELLE STORE").draw(in:NSRect(x:70,y:155,width:884,height:80), withAttributes:a3)
          img.unlockFocus()
          let rep = NSBitmapImageRep(data: img.tiffRepresentation!)!
          try rep.representation(using: .png, properties: [:])!.write(to: URL(fileURLWithPath: "V5iOS-v0.2/V5iOS/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"))
          SWIFTICON
          swift /tmp/make_icon.swift
          cp V5iOS-v0.2/V5iOS/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png V5iOS-v0.2/V5iOS/Assets.xcassets/BrandLogo.imageset/BrandLogo.png

          cat > V5iOS-v0.2/V5iOS/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > V5iOS-v0.2/V5iOS/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
          cat > V5iOS-v0.2/V5iOS/Assets.xcassets/BrandLogo.imageset/Contents.json <<'JSON'
          {"images":[{"filename":"BrandLogo.png","idiom":"universal","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Download MoltenVK 1.4.2
        run: |
          cd V5iOS-v0.2
          mkdir -p deps/mvk
          curl -fL --retry 3 -o deps/MoltenVK-ios.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar -xf deps/MoltenVK-ios.tar -C deps/mvk
          MVK_LIB=$(find "$PWD/deps/mvk" -type f -path '*/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a' -print -quit)
          VULKAN_H=$(find "$PWD/deps/mvk" -type f -path '*/vulkan/vulkan.h' -print -quit)
          test -f "$MVK_LIB"; test -f "$VULKAN_H"
          echo "MVK_LIB=$MVK_LIB" >> "$GITHUB_ENV"
          echo "MVK_INCLUDE=$(dirname "$(dirname "$VULKAN_H")")" >> "$GITHUB_ENV"

      - name: Build V5iOS v1.0
        run: |
          cd V5iOS-v0.2
          xcodebuild \
            -project V5iOS.xcodeproj \
            -scheme V5iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            HEADER_SEARCH_PATHS="$MVK_INCLUDE" \
            OTHER_LDFLAGS="\$(inherited) $MVK_LIB -ObjC -lc++ -framework Metal -framework Foundation -framework QuartzCore -framework CoreGraphics -framework UIKit -framework IOSurface" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          cd V5iOS-v0.2
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf Payload V5iOS-v1.0-FINAL-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry V5iOS-v1.0-FINAL-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: V5iOS-v1.0-FINAL-unsigned-ipa
          path: V5iOS-v0.2/V5iOS-v1.0-FINAL-unsigned.ipa
          if-no-files-found: error
